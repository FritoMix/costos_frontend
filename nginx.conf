# DATACONTROL - servidor web del frontend
#
# Hace dos cosas:
#   1) Sirve la app de Angular ya compilada.
#   2) Reenvia todo lo que empiece por /api al contenedor de la API.
#
# Gracias al punto 2, el navegador siempre habla con un solo origen: no hay
# CORS que configurar ni URLs distintas segun el entorno.

# Zona de limitacion de tasa: maximo 10 peticiones por minuto por IP con burst de 5
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME: arranca de los tipos que trae Nginx y agrega el de la PWA
    # (manifest.webmanifest), que no viene por defecto.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Compresion: la app carga mas rapido en la red de la fabrica.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras reforzadas de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

    # --- Proteccion de fuerza bruta en Login ---
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las exportaciones a Excel pueden tardar con muchos datos.
        proxy_read_timeout 120s;
    }

    # --- PWA: manifest y service worker ---
    # ngsw.json controla las actualizaciones del service worker: nunca se
    # cachea fuerte, el navegador tiene que revalidarlo para enterarse de
    # nuevas versiones.
    location = /ngsw.json {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type "application/json";
        try_files $uri =404;
    }

    # El "worker" que hace funcionar la app instalada y offline.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Manifest de instalación: corto de cachear (cambia con cada release).
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- Archivos con hash en el nombre: se pueden cachear para siempre ---
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- La app (rutas de Angular) ---
    # Cualquier direccion que no sea un archivo real devuelve index.html:
    # es lo que permite recargar con F5 estando en /ordenes/12 sin ver un 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
    }
}
