<div class="anim-entrada mx-auto max-w-md space-y-6">
  <div class="grid grid-cols-2 gap-3">
    <button
      type="button"
      data-testid="parada-no"
      (click)="elegir(false)"
      [class]="claseOpcion(hayParada() === false)"
    >
      <span class="text-lg">No</span>
      <span class="text-xs font-medium text-slate-500">Trabajó toda la hora</span>
    </button>
    <button
      type="button"
      data-testid="parada-si"
      (click)="elegir(true)"
      [class]="claseOpcion(hayParada() === true)"
    >
      <span class="text-lg">Sí, paró</span>
      <span class="text-xs font-medium text-slate-500">Hubo minutos sin producir</span>
    </button>
  </div>

  @if (hayParada() === true) {
    <div>
      <p class="text-center text-sm font-bold text-slate-700">¿Cuántos minutos?</p>
      <div class="mt-3 flex flex-wrap justify-center gap-2">
        @for (min of opcionesMinutos; track min) {
          <button
            type="button"
            [attr.data-testid]="'parada-min-' + min"
            (click)="minutos.set(min)"
            [class]="claseMinutos(minutos() === min)"
          >
            {{ min }}
          </button>
        }
      </div>
    </div>

    <div>
      <p class="text-center text-sm font-bold text-slate-700">¿Por qué paró?</p>
      <div class="mt-3 grid gap-2 sm:grid-cols-2">
        @for (c of causas; track c.valor) {
          <button
            type="button"
            [attr.data-testid]="'parada-causa-' + c.valor"
            (click)="causa.set(c.valor)"
            [class]="claseCausa(causa() === c.valor)"
          >
            {{ c.nombre }}
          </button>
        }
      </div>
      @if (causa() === 'otro') {
        <input
          type="text"
          maxlength="300"
          class="campo mt-3 w-full"
          placeholder="Escribe la causa"
          aria-label="Causa de la parada"
          [value]="nota()"
          (input)="nota.set($any($event.target).value)"
        />
      }
    </div>
  }
</div>
