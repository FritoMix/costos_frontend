<div class="anim-entrada">
  <div class="flex flex-wrap justify-center gap-3">
    @for (n of opciones(); track n) {
      <button
        type="button"
        [attr.data-testid]="prefijoTestId() + n"
        (click)="valor.set(n)"
        [class]="claseValorGrande(valor() === n)"
      >
        {{ n }}
      </button>
    }
  </div>
  @if (valor() > 0) {
    <p class="mt-5 text-center text-xs font-semibold text-slate-500">
      {{ valor() }}
      {{ valor() === 1 ? 'persona' : 'personas' }} {{ area() }}
    </p>
  }
</div>
