version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: [dependencias, frontend]
    groups:
      angular:
        patterns:
          - "@angular/*"
    ignore:
      # Angular fija la version de TypeScript que soporta; un salto mayor
      # aislado (por ejemplo TS 7 con Angular 22) rompe npm ci.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencias, ci]
    groups:
      acciones:
        patterns:
          - "*"
